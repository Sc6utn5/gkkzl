<style>
/* Layout: documentation-style portal. Top bar with search, left week navigation, centre reading column, right "on this page" rail. Accent teal; HTML/CSS/JS keep their own hues. */
:root{
 --bg:#F6F7F9;--surface:#FFFFFF;--ink:#0F172A;--muted:#566175;--line:#E1E5EC;--accent:#0B6E75;--onaccent:#FFFFFF;--soft:#E4F1F2;
 --html:#C93E17;--css:#2457D6;--js:#946500;--ok:#177A45;--okbg:#E3F4EA;--bad:#B42318;--badbg:#FCE9E7;--code:#EEF1F6;
 --f-ui:"IBM Plex Sans",system-ui,"Segoe UI",sans-serif;--f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
 --gx:max(16px,env(safe-area-inset-left,0px));--gy:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--surface:#111A2E;--ink:#E7ECF5;--muted:#93A0B8;--line:#233048;--accent:#4FC3CC;--onaccent:#06222A;--soft:#12303A;--html:#FF7A52;--css:#7FA2FF;--js:#E8B63A;--ok:#4CC38A;--okbg:#10301F;--bad:#FF7B72;--badbg:#3A1714;--code:#0D1526;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1220;--surface:#111A2E;--ink:#E7ECF5;--muted:#93A0B8;--line:#233048;--accent:#4FC3CC;--onaccent:#06222A;--soft:#12303A;--html:#FF7A52;--css:#7FA2FF;--js:#E8B63A;--ok:#4CC38A;--okbg:#10301F;--bad:#FF7B72;--badbg:#3A1714;--code:#0D1526;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-ui);padding-left:var(--gx);padding-right:var(--gy);-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol,figure{margin:0}ul,ol{padding:0;list-style:none}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
code{font:500 .86em var(--f-mono);background:var(--code);border:1px solid var(--line);padding:1px 6px;border-radius:5px;word-break:break-word}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;margin:0 calc(-1*var(--gy)) 0 calc(-1*var(--gx));padding:10px var(--gy) 10px var(--gx);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--bg)}
.top .in{max-width:1360px;margin:0 auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);font-weight:600;white-space:nowrap}
.brand i{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:500 12px var(--f-mono);font-style:normal}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;line-height:1.1}
.sp{flex:1}
.btn{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:14px;transition:border-color .2s,transform .2s,background .2s}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--onaccent);border-color:var(--accent);font-weight:500}
.btn.pri:hover{filter:brightness(1.07)}
.search{min-width:260px;justify-content:space-between;color:var(--muted)}
.kbd{font:500 11px var(--f-mono);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--bg)}
#menu{display:none}
@media(max-width:1000px){#menu{display:inline-flex}.search{min-width:0}.search span.t{display:none}.brand small{display:none}}

/* shell */
.shell{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr) 210px;gap:36px;align-items:start}
@media(max-width:1180px){.shell{grid-template-columns:250px minmax(0,1fr)}.toc{display:none}}
@media(max-width:1000px){.shell{grid-template-columns:minmax(0,1fr);gap:0}}
.side{position:sticky;top:calc(61px + env(safe-area-inset-top,0px));max-height:calc(100vh - 61px);overflow:auto;padding:22px 0 30px}
@media(max-width:1000px){.side{position:fixed;z-index:39;left:0;top:calc(61px + env(safe-area-inset-top,0px));bottom:0;width:min(300px,86vw);max-height:none;background:var(--surface);border-right:1px solid var(--line);padding:18px 16px 30px;transform:translateX(-102%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}.side.open{transform:none;box-shadow:0 0 0 100vmax rgba(5,10,20,.45)}}
.side h4{margin:18px 0 6px;font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-left:10px}
.side a.nl{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;text-decoration:none;color:var(--ink);font-size:14.5px;position:relative;transition:background .2s}
.side a.nl:hover{background:var(--soft)}
.side a.nl .wn{font:500 11px var(--f-mono);color:var(--wc,var(--muted));width:26px;flex:none}
.side a.nl.on{background:var(--soft);font-weight:600}
.side a.nl.on::before{content:"";position:absolute;left:-1px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--wc,var(--accent))}
.side a.nl .ck{margin-left:auto;font:500 11px var(--f-mono);color:var(--muted)}
.side a.nl .ck.done{color:var(--ok)}
.prog{margin:16px 10px 0;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.prog b{font-size:13px}.prog .bar{height:6px;border-radius:3px;background:var(--line);margin:10px 0 6px;overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:3px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.prog small{color:var(--muted);font-size:12px}

/* content */
main{padding:34px 0 80px;min-width:0}
.page{animation:in .5s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{display:flex;gap:10px;align-items:center;font:500 12px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--wc,var(--accent))}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--wc,var(--accent))}
h1{font-size:clamp(2rem,4.6vw,3.1rem);line-height:1.08;letter-spacing:-.02em;font-weight:600;margin:12px 0 14px;text-wrap:balance}
h2{font-size:1.55rem;letter-spacing:-.01em;font-weight:600;margin:56px 0 6px;text-wrap:balance}
h2 + .sub{color:var(--muted);margin-bottom:18px}
h3{font-size:1.05rem;font-weight:600}
.lead{color:var(--muted);font-size:1.1rem;max-width:62ch}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;min-width:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:860px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}}
.stat b{display:block;font:600 2.2rem/1 var(--f-ui);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 12px var(--f-mono);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--surface);color:var(--muted)}
.hero{padding-bottom:6px}
.hero .meta{margin-top:20px}

/* tables & lists */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
tr:last-child td{border-bottom:0}
.ticks li{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ticks li:last-child{border-bottom:0}
.ticks li::before{content:"";width:8px;height:8px;margin:9px 0 0 4px;border-radius:2px;background:var(--wc,var(--accent));transform:rotate(45deg)}
.topics{display:flex;flex-wrap:wrap;gap:8px}
.topics span{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;font-size:14px}

/* roadmap */
.road{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:6px}
@media(max-width:900px){.road{grid-template-columns:repeat(7,minmax(0,1fr))}}
@media(max-width:520px){.road{grid-template-columns:repeat(4,minmax(0,1fr))}}
.rw{border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center;background:var(--surface);text-decoration:none;color:var(--ink);display:block;font:500 12px var(--f-mono);transition:transform .2s,border-color .2s}
.rw small{display:block;font:400 10px var(--f-ui);color:var(--muted);margin-top:2px}
a.rw:hover{transform:translateY(-3px);border-color:var(--wc)}
a.rw{border-top:3px solid var(--wc)}
.rw.soon{border-style:dashed;color:var(--muted);background:transparent}
.rphases{display:grid;grid-template-columns:7fr 4fr 2fr;gap:6px;margin-top:8px;font:500 11px var(--f-mono);color:var(--muted)}
.rphases span{border-top:2px solid var(--line);padding-top:6px}
@media(max-width:900px){.rphases{display:none}}

/* layers figure */
.layers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media(max-width:700px){.layers{grid-template-columns:minmax(0,1fr)}}
.ly{border-radius:14px;padding:18px;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c)}
.ly b{font:600 1.25rem var(--f-ui);color:var(--c)}
.ly p{color:var(--muted);font-size:14.5px;margin-top:4px}
.ly em{font-style:normal;font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:6px}

/* donut */
.donut{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:center}
@media(max-width:560px){.donut{grid-template-columns:1fr;justify-items:center}}
.donut svg{width:190px;height:190px;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:26;stroke-dasharray:0 100;transition:stroke-dasharray 1.4s cubic-bezier(.2,.8,.2,1)}
.leg li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.leg li:last-child{border-bottom:0}
.leg i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none;transform:translateY(1px)}
.leg b{font-variant-numeric:tabular-nums;min-width:38px}

/* week header */
.wk-head{border-bottom:1px solid var(--line);padding-bottom:26px}
.wk-nav{display:flex;justify-content:space-between;gap:12px;margin-top:64px;flex-wrap:wrap}
.wk-nav a{flex:1;min-width:220px;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface);transition:border-color .2s,transform .2s}
.wk-nav a:hover{border-color:var(--accent);transform:translateY(-2px)}
.wk-nav small{display:block;color:var(--muted);font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.wk-nav a.r{text-align:right}

/* mistakes */
.mist{display:grid;gap:10px}
.mi{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:14px 16px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:14px;transition:border-color .2s}
.mi:hover{border-color:var(--wc,var(--accent))}
@media(max-width:760px){.mi{grid-template-columns:minmax(0,1fr)}}
.mi small{display:block;font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.mi .bad small{color:var(--bad)}.mi .fix small{color:var(--ok)}
.mi .t{font-weight:600}

/* diff */
.diffs{display:grid;gap:16px}
.df{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.df>div:first-child{padding:12px 16px;border-bottom:1px solid var(--line)}
.df>div:first-child p{color:var(--muted);font-size:14px}
.df .two{display:grid;grid-template-columns:1fr 1fr}
@media(max-width:700px){.df .two{grid-template-columns:1fr}}
.df pre{margin:0;padding:12px 16px;font:400 12.5px/1.6 var(--f-mono);overflow-x:auto;white-space:pre}
.df pre.b{background:var(--badbg)}.df pre.g{background:var(--okbg)}
.df .lab{font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:6px 16px 0}
.df .lab.b{background:var(--badbg);color:var(--bad)}.df .lab.g{background:var(--okbg);color:var(--ok)}

/* quiz */
.qz-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.score{display:flex;align-items:center;gap:10px;font-weight:600}
.score svg{width:44px;height:44px;transform:rotate(-90deg)}
.score circle{fill:none;stroke-width:5}
.q{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:18px;margin-bottom:12px}
.q .qt{font-weight:600;margin-bottom:12px;display:flex;gap:10px}
.q .qt span:first-child{font:500 12px var(--f-mono);color:var(--wc,var(--accent));padding-top:4px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;transition:border-color .2s,background .2s,transform .15s}
.opt:hover:not(:disabled){border-color:var(--accent);transform:translateX(3px)}
.opt b{font:500 12px var(--f-mono);color:var(--muted);padding-top:3px}
.opt:disabled{cursor:default}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.no{background:var(--badbg);border-color:var(--bad)}
.opt.ok b::after{content:" ✓";color:var(--ok)}.opt.no b::after{content:" ✕";color:var(--bad)}
.fb{margin-top:10px;font-size:14px;color:var(--muted)}

/* homework */
.hw li{border-bottom:1px solid var(--line)}
.hw li:last-child{border-bottom:0}
.hw label{display:flex;gap:12px;padding:11px 2px;cursor:pointer;align-items:flex-start}
.hw input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent);flex:none}
.hw input:checked + span{color:var(--muted);text-decoration:line-through}

/* rubric */
.rub .row{display:grid;grid-template-columns:150px 1fr 46px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.rub .row:last-child{border-bottom:0}
.rub .tr{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.rub .tr i{display:block;height:100%;width:0;background:var(--wc);border-radius:5px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.rub b{text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:560px){.rub .row{grid-template-columns:1fr 46px}.rub .tr{grid-column:1/-1;order:3}}

/* toc */
.toc{position:sticky;top:calc(61px + env(safe-area-inset-top,0px));padding:34px 0;font-size:13.5px}
.toc h4{margin:0 0 10px;font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.toc a{display:block;padding:5px 0 5px 12px;border-left:2px solid var(--line);color:var(--muted);text-decoration:none;transition:.2s}
.toc a:hover{color:var(--ink)}.toc a.on{color:var(--ink);border-color:var(--wc,var(--accent));font-weight:500}

/* palette */
#pal{position:fixed;inset:0;z-index:80;background:rgba(5,10,20,.55);display:none;align-items:flex-start;justify-content:center;padding:max(12vh,60px) 16px 16px}
#pal.open{display:flex}
.pbox{width:min(640px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.35);overflow:hidden;animation:in .25s}
.pbox input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:400 17px var(--f-ui);padding:18px 20px;outline:none}
.pres{max-height:52vh;overflow:auto;padding:8px}
.pr{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:9px}
.pr.sel,.pr:hover{background:var(--soft)}
.pr small{display:block;color:var(--muted);font:500 11px var(--f-mono);letter-spacing:.05em;text-transform:uppercase}
.pr span{font-size:14.5px}
.pr mark{background:color-mix(in srgb,var(--accent) 25%,transparent);color:inherit;border-radius:3px}
.pempty{padding:22px;color:var(--muted);text-align:center}
footer{border-top:1px solid var(--line);padding:26px 0 40px;color:var(--muted);font-size:13.5px;max-width:1360px;margin:0 auto;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
</style>

 summary:["HTML içeriği elemanlarla işaretler; yapıyı ve anlamı tanımlar, görünümü değil.","Her sayfa: `<!DOCTYPE html>`, `<html lang>`, charset, viewport ve title içeren `<head>`, ve `<body>`.","Eleman = etiketler + içerik; öznitelikler bilgi ekler; doğru iç içe geçir; boş elemanların kapanış etiketi yoktur.","Bir tane `<h1>`, sonra h2–h6 sırayla; paragraf `<p>`; boşluklar tek boşluğa çöker.","Metin elemanlarını anlamına göre seç: `<strong>`, `<em>`, `<mark>`, `<code>`, `<blockquote>`; `<` ve `&` için varlık kullan.","Anlamsal yerleşim: header, nav, main, section, article, aside, footer – `div`/`span` yalnızca uygun eleman yoksa.","DevTools Elements yapıyı gösterir; Emmet onu hızla yazar."],

 topics:["Hiperbağlantı nedir?","Anchor elemanı ve `href`","Mutlak ve göreli URL","Klasör yolları: proje ağacını okumak","Hangi yolu yazmalıyım?","Çok sayfalı sitede bağlantılar","`nav` ve `ul` ile gezinme menüsü","Parça (fragment) bağlantıları","Sık kullanılan özel bağlantılar","İyi bağlantı metni","`img` elemanı","İyi ve kötü alt metin","Görsel formatları","Görsel boyutu","`figure` ve `figcaption` ile galeri","Bağlantı olarak görsel","Duyarlı görsellere önizleme","Telif ve lisanslar","Bağlantılar ve görseller neden kırılır?","DevTools'ta 404 okumak"],

 topics:["Üç tür liste","`ul` ve `li`","`ol`: type, start, reversed","`dl`, `dt`, `dd`","İç içe listeler","Gezinme için listeler","Tablo ne zaman kullanılır?","Tablo yapısı: bir kafe menüsü","`colspan` ve `rowspan` ile birleştirme","Haftalık ders programı örneği","Birleşik hücreli tabloyu planlamak","Erişilebilir tablolar","HTML'i neden doğrularız?","Doğrulama akışı","Sayfayı kontrol etmenin üç yolu","Hata ve uyarı farkı","En sık görülen 5 hata"],

 summary:["Sırasız öğeler için `<ul>`, adımlar ve sıralamalar için `<ol>` (`start`, `reversed`), terim–açıklama için `<dl>`.","İç içe listeler bir `<li>` içine girer; gezinme menüsü `<nav>` içinde bağlantı `<ul>`'sidir.","Tablolar yalnızca veri içindir: `<caption>`, `<thead>`, `<tbody>`, `<tfoot>`, `<tr>`, `<th scope>`, `<td>`.","`colspan` sağa, `rowspan` aşağı birleştirir; her satırın sütun sayısı aynı olmalı.","W3C Markup Validator sayfayı URI, dosya yükleme veya doğrudan girişle denetler.","Hatalar düzeltilmeli, uyarılar tavsiyedir; her zaman önce ilk hatayı düzelt.","Bundan sonra her sayfa için hedefimiz: 0 hata."],

 if(!keep)scrollTo(0,0);else scrollTo(0,y);
 $("#side").classList.remove("open");
}
function bind(i){
 $$("[data-n]").forEach(function(el){var t=+el.dataset.n,s=performance.now();if(reduce){el.textContent=t;return}(function f(n){var p=Math.min(1,(n-s)/1000);el.textContent=Math.round(t*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)})(s)});
 var dn=$("#dn");if(dn)setTimeout(function(){$$("circle[data-len]",dn).forEach(function(c){c.style.strokeDasharray=c.dataset.len+" 100"})},80);
 $$(".rub i").forEach(function(b){setTimeout(function(){b.style.width=b.dataset.w+"%"},120)});
 var sb=$("#sbtn2");if(sb)sb.onclick=openPal;
 if(i<0)return;var w=W[i];
 $$(".q .opt").forEach(function(b){b.onclick=function(){var q=b.closest(".q"),k=+q.dataset.k;ST.q["w"+w.n]=ST.q["w"+w.n]||{};ST.q["w"+w.n][k]=+b.dataset.j;save();q.outerHTML=qHtml(w,w.quiz[k],k,+b.dataset.j);qHead(w);side(cur);bind(i)}});
 $$("input[type=checkbox]").forEach(function(c){c.onchange=function(){var key=c.dataset.k,bag=ST[key]["w"+w.n]=ST[key]["w"+w.n]||{};bag[c.dataset.i]=c.checked;save()}});
}
function toc(i){
 var hs=$$("#view h2");if(!hs.length){$("#toc").innerHTML="";return}
 $("#toc").innerHTML='<h4>Bu sayfada</h4>'+hs.map(function(h){return '<a href="#'+h.id+'">'+esc(h.textContent)+'</a>'}).join("");
 $$("#toc a").forEach(function(a){a.onclick=function(e){e.preventDefault();D.getElementById(a.getAttribute("href").slice(1)).scrollIntoView()}});
}
addEventListener("scroll",function(){var hs=$$("#view h2"),on=null;hs.forEach(function(h){if(h.getBoundingClientRect().top<140)on=h.id});$$("#toc a").forEach(function(a){a.classList.toggle("on",a.getAttribute("href")==="#"+on)})},{passive:true});
addEventListener("hashchange",function(){route()});

/* ---------- search ---------- */
var IDX=[];
W.forEach(function(w){
 var add=function(sec,t,id){IDX.push({s:w.slug,l:"Hafta "+w.n+" · "+sec,t:t,id:id})};
 w.topics.forEach(function(t){add("Konu",t,"konular")});w.goals.forEach(function(t){add("Hedef",t,"hedefler")});w.summary.forEach(function(t){add("Özet",t,"ozet-h")});
 w.mist.forEach(function(m){add("Hata",m[0]+" — "+m[1]+" "+m[2],"hatalar")});w.quiz.forEach(function(q){add("Quiz",q[0],"quiz")});w.hw.forEach(function(t){add("Ödev",t,"odev")});
 if(w.fixes)w.fixes.forEach(function(f){add("Doğrulama hatası",f[0]+" "+f[1],"hatalar-kod")});
 if(w.check)w.check.forEach(function(c){add("Kalite listesi",c[0]+" "+c[1],"kontrol")});
 if(w.anatomy)w.anatomy.forEach(function(a){add("Anatomi",a.join(" — "),"anatomi")});
});
LOS.forEach(function(l){IDX.push({s:"ozet",l:"Genel · Öğrenme çıktısı",t:l[0]+" "+l[1],id:"cikti"})});
TOOLS.forEach(function(t){IDX.push({s:"ozet",l:"Genel · Araç",t:t[0]+" — "+t[1],id:"araclar"})});
var pal=$("#pal"),pin=$("#pin"),pres=$("#pres"),sel=0,res=[];
function norm(t){return t.toLowerCase().replace(/[`<>]/g,"")}
function hl(t,qs){var s=esc(t.replace(/`/g,""));qs.forEach(function(q){if(!q)return;var re=new RegExp("("+q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig");s=s.replace(re,"<mark>$1</mark>")});return s}
function doSearch(){
 var q=norm(pin.value.trim()),qs=q.split(/\s+/).filter(Boolean);res=[];
 if(qs.length)res=IDX.filter(function(x){var n=norm(x.t);return qs.every(function(w){return n.indexOf(w)>=0})}).slice(0,40);
 sel=0;draw(qs);
}
function draw(qs){
 if(!res.length){pres.innerHTML='<div class="pempty">'+(pin.value.trim()?"Sonuç yok. Başka bir kelime dene.":"Yazmaya başla. Altı haftanın tüm konuları, hataları ve soruları aranır.")+'</div>';return}
 pres.innerHTML=res.map(function(r,i){var t=r.t.length>150?r.t.slice(0,150)+"…":r.t;return '<button type="button" class="pr'+(i===sel?" sel":"")+'" data-i="'+i+'"><small>'+esc(r.l)+'</small><span>'+hl(t,qs)+'</span></button>'}).join("");
 $$(".pr",pres).forEach(function(b){b.onclick=function(){go(res[+b.dataset.i])}});
}
function go(r){closePal();var t=function(){var el=D.getElementById(r.id);if(el)el.scrollIntoView()};if(location.hash==="#"+r.s){t()}else{location.hash=r.s;setTimeout(t,80)}}
function openPal(){pal.classList.add("open");pin.value="";res=[];draw([]);setTimeout(function(){pin.focus()},20)}
function closePal(){pal.classList.remove("open")}
pin.oninput=doSearch;
pal.onclick=function(e){if(e.target===pal)closePal()};
$("#sbtn").onclick=openPal;
D.addEventListener("keydown",function(e){
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();pal.classList.contains("open")?closePal():openPal();return}
 if(e.key==="/"&&!pal.classList.contains("open")&&!/INPUT|TEXTAREA/.test(D.activeElement.tagName)){e.preventDefault();openPal();return}
 if(!pal.classList.contains("open"))return;
 if(e.key==="Escape")closePal();
 if(e.key==="ArrowDown"&&res.length){e.preventDefault();sel=(sel+1)%res.length;draw(norm(pin.value).split(/\s+/));$(".pr.sel",pres).scrollIntoView({block:"nearest"})}
 if(e.key==="ArrowUp"&&res.length){e.preventDefault();sel=(sel-1+res.length)%res.length;draw(norm(pin.value).split(/\s+/));$(".pr.sel",pres).scrollIntoView({block:"nearest"})}
 if(e.key==="Enter"&&res[sel])go(res[sel]);
});

D.addEventListener("click",function(e){var s=$("#side");if(s.classList.contains("open")&&!s.contains(e.target)&&e.target.id!=="menu")s.classList.remove("open")});
try{var th=localStorage.getItem("wt-theme");if(th)R.dataset.theme=th}catch(e){}
$("#theme").onclick=function(){var dark=R.dataset.theme?R.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches,n=dark?"light":"dark";R.dataset.theme=n;try{localStorage.setItem("wt-theme",n)}catch(e){}};
route();
